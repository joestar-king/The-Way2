      <button class="hot" id="hMarket" aria-label="Market"></button><button class="hot" id="hBig" aria-label="Big Purchases"></button><button class="hot" id="hIncome" aria-label="Income"></button><button class="hot" id="hFixed" aria-label="Fixed Charges"></button>
      <button class="hot" id="hPdf" aria-label="Export PDF"></button><button class="hot" id="hBackup" aria-label="Backup"></button>
      <button class="hot" id="hNavVillage" aria-label="Village"></button><button class="hot" id="hNavActivity" aria-label="Activity"></button><button class="hot" id="hNavFinance" aria-label="Finance"></button><button class="hot" id="hNavWay" aria-label="The Way"></button><button class="hot" id="hNavSettings" aria-label="Settings"></button>
      <button class="hot" id="hSpotVillage" aria-label="Village map"></button><button class="hot" id="hSpotMarket" aria-label="Market map"></button><button class="hot" id="hSpotIncome" aria-label="Income map"></button><button class="hot" id="hSpotBig" aria-label="Big Purchases map"></button><button class="hot" id="hSpotFixed" aria-label="Fixed Charges map"></button><button class="hot" id="hSpotLedger" aria-label="Ledger map"></button><button class="hot" id="hMonth" aria-label="Change month"></button>
    </div>
  </section>

  <section id="wayScreen" class="screen">
    <div class="wayDesignWrap">
      <div class="design way-design" id="wayDesign">
        <img class="ref" src="way-screen.png" alt="Tangier RPG Quest Interface">
        <div id="wayProgressPatch"><b id="wayLevel">Lv. 1</b><span id="wayXpText">0 / 100</span><div class="miniXp"><div id="wayXpFill"></div></div></div>
        <button class="hot" id="hWayPortrait" aria-label="Return to Finance"></button><button class="hot" id="hQuest"></button><button class="hot" id="hSkills"></button><button class="hot" id="hItems"></button><button class="hot" id="hEquipment"></button><button class="hot" id="hStatus"></button><button class="hot" id="hMap"></button><button class="hot" id="hLore"></button><button class="hot" id="hViewDetails"></button><button class="hot" id="hWorldMap"></button><button class="hot" id="hLocalMap"></button>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="backHint" id="backHint">Tap Issam's portrait to return to Finance</div>
<script>(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const KEY='theway.app.v5';
  const now = new Date();
  const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const blankMonth=()=>({income:[],fixed:[],market:[],big:[]});
  const blankState=()=>({activeMonth:currentMonthKey,months:{[currentMonthKey]:blankMonth()},xp:0,relics:0,puzzleDone:false,fragment:false,route:'village'});
  let state;
  try{ state=Object.assign(blankState(),JSON.parse(localStorage.getItem(KEY)||'{}')); }catch{ state=blankState(); }
  if(!state.months) state.months={};
  if(!state.activeMonth) state.activeMonth=currentMonthKey;
  if(!state.months[state.activeMonth]) state.months[state.activeMonth]=blankMonth();
  let puzzleSeq=[];

  function month(){ if(!state.months[state.activeMonth]) state.months[state.activeMonth]=blankMonth(); return state.months[state.activeMonth]; }
  function save(){ localStorage.setItem(KEY,JSON.stringify(state)); render(); }
  function money(n){ const x=Math.round((Number(n)||0)*100)/100; return x.toLocaleString('en-US',{maximumFractionDigits:2}); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function monthLabel(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short',year:'numeric'}); }
  function totals(){
    const m=month();
    const received=m.income.filter(x=>x.received).reduce((a,x)=>a+Number(x.amount||0),0);
    const expected=m.income.reduce((a,x)=>a+Number(x.amount||0),0);
    const fixed=m.fixed.reduce((a,x)=>a+Number(x.amount||0),0);
    const market=m.market.reduce((a,x)=>a+Number(x.amount||0),0);
    const big=m.big.reduce((a,x)=>a+Number(x.amount||0),0);
    const spending=market+big;
    const gold=received===0?0:received-fixed-spending;
    return {received,expected,fixed,market,big,spending,gold};
  }
  function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function id(){ return `${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`; }
  function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2100); }

  function categoryStats(){
    const m=month(); const map={Food:0,Transport:0,Housing:0,Personal:0,Other:0};
    [...m.market,...m.big].forEach(x=>{ const c=map[x.category]!==undefined?x.category:'Other'; map[c]+=Number(x.amount||0); });
    const total=Object.values(map).reduce((a,b)=>a+b,0);
    return Object.entries(map).map(([name,amount])=>({name,amount,pct:total?Math.round(amount/total*100):0}));
  }
  function recentActivity(){
    const m=month();
    return [
      ...m.market.map(x=>({...x,type:'Market',sign:-1})),
      ...m.big.map(x=>({...x,type:'Big Purchase',sign:-1})),
      ...m.fixed.map(x=>({...x,type:'Fixed Charge',sign:-1})),
      ...m.income.filter(x=>x.received).map(x=>({...x,date:x.receivedDate||x.date,type:'Income',sign:1}))
    ].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,4);
  }
  function largestExpense(){
    const m=month(); const all=[...m.market.map(x=>({...x,type:'Market'})),...m.big.map(x=>({...x,type:'Big Purchase'}))];
    return all.sort((a,b)=>Number(b.amount)-Number(a.amount))[0]||null;
  }

  function fitMoneyPatch(el, charsSmall=11, charsTiny=14){
    if(!el) return;
    const txt=(el.textContent||'').replace(/\s+/g,' ').trim();
    el.classList.remove('fitSmall','fitTiny');
    if(txt.length>=charsTiny) el.classList.add('fitTiny');
    else if(txt.length>=charsSmall) el.classList.add('fitSmall');
  }

  function fitMetricValue(el){
    if(!el) return;
    const txt=(el.textContent||'').trim();
    const len=txt.length;
    if(len>=13) el.style.fontSize='clamp(7px,1.55vw,11px)';
    else if(len>=11) el.style.fontSize='clamp(7.5px,1.7vw,12px)';
    else if(len>=9) el.style.fontSize='clamp(8px,1.85vw,13px)';
    else el.style.fontSize='clamp(8px,1.95vw,14px)';
  }

  function render(){
    const t=totals();
    $('#goldCounter').textContent=money(t.gold);
    $('#xpCounter').textContent=state.xp||0;
    $('#relicCounter').textContent=state.relics||0;
    $('#goldLeft').textContent=money(t.gold);
    $('#receivedPatch').textContent=`${money(t.received)} MAD`;
    $('#commitPatch').textContent=`${money(t.fixed)} MAD`;
    $('#spendPatch').textContent=`${money(t.spending)} MAD`;
    fitMoneyPatch($('#goldValuePatch'));
    fitMetricValue($('#receivedPatch'));
    fitMetricValue($('#commitPatch'));
    fitMetricValue($('#spendPatch'));
    $('#goldFill').style.width=(t.received?Math.max(0,Math.min(100,t.gold/t.received*100)):0)+'%';
    const [yy,mm]=state.activeMonth.split('-').map(Number);
    $('#monthPatch').innerHTML=`Month ${mm}<br>${new Date(yy,mm-1,1).toLocaleString('en-US',{month:'short'})} ${yy}<br>Morocco`;
    const cats=categoryStats();
    $('#categoryPanel').innerHTML=`<div class="categoryHead"><span>🧾 &nbsp; Spending by Category</span><button data-ledger="1">View Details ›</button></div><div class="catRows">${cats.map(c=>`<div class="catRow"><span>${categoryIcon(c.name)} ${c.name}</span><span>${money(c.amount)} MAD</span><div class="catBar"><div class="catFill" style="width:${c.pct}%"></div></div><b>${c.pct}%</b></div>`).join('')}</div>`;
    const largest=largestExpense(); const recent=recentActivity();
    $('#lowerPanel').innerHTML=`<div class="lowerCard pixel-panel"><div class="lowerTitle">💰 &nbsp; Largest Expense</div><div class="largestBody"><span class="largestIcon">${largest?categoryIcon(largest.category):'—'}</span><span>${largest?`${esc(largest.desc)}<br><b style="color:#a11f20">${money(largest.amount)} MAD</b>`:'No spending yet'}</span></div></div><div class="lowerCard pixel-panel"><div class="lowerTitle">📜 &nbsp; Recent Activity</div><div class="recentRows">${recent.length?recent.map(x=>`<div class="recentRow ${x.sign>0?'income':''}"><span>${activityIcon(x.type)} ${esc(x.desc)}</span><span>${formatShortDate(x.date)}</span><span class="amt">${x.sign>0?'+':'-'}${money(x.amount)} MAD</span></div>`).join(''):'<div>No activity yet.</div>'}</div></div>`;
    const lvl=Math.floor((state.xp||0)/100)+1, within=(state.xp||0)%100;
    $('#wayLevel').textContent=`Lv. ${lvl}`; $('#wayXpText').textContent=`${within} / 100`; $('#wayXpFill').style.width=`${within}%`;
    setRoute(state.route||'village',false);
    const ledgerBtn=$('[data-ledger="1"]'); if(ledgerBtn) ledgerBtn.onclick=openLedger;
  }
  function categoryIcon(c){ return ({Food:'🍎',Transport:'🐎',Housing:'🏠',Personal:'👕',Other:'📦'})[c]||'📦'; }
  function activityIcon(t){ return t==='Income'?'🪙':t==='Market'?'🛒':t==='Big Purchase'?'🧰':'📜'; }
  function formatShortDate(d){ if(!d)return''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }

  const routePos={village:[17,29],market:[40,26],income:[54,16],big:[77,18],fixed:[65,28],ledger:[90,27]};
  function setRoute(k,animate=true){ state.route=k; const p=routePos[k]||routePos.village; const mk=$('#routeMarker'); if(!animate)mk.style.transition='none'; mk.style.left=p[0]+'%'; mk.style.top=p[1]+'%'; if(!animate){void mk.offsetWidth;mk.style.transition='';} localStorage.setItem(KEY,JSON.stringify(state)); }
  function travelThen(k,cb){ setRoute(k,true); setTimeout(()=>cb&&cb(),520); }

  function showScreen(name){ $$('.screen').forEach(s=>s.classList.remove('active')); $('#'+name).classList.add('active'); window.scrollTo({top:0,behavior:'auto'}); if(name==='wayScreen'){ const hint=$('#backHint'); hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),2600); } }

  function openSheet(title,content,cls=''){ $('#sheet').className='sheet '+cls; $('#sheet').innerHTML=`<div class="sheetHead"><h2>${title}</h2><button class="closeBtn" id="closeSheet">✕</button></div>${content}`; $('#modal').classList.add('open'); $('#closeSheet').onclick=closeSheet; }
  function closeSheet(){ $('#modal').classList.remove('open'); }
  $('#modal').addEventListener('click',e=>{ if(e.target===$('#modal'))closeSheet(); });

  function financeForm(type){
    const m=month();
    if(type==='income'){
      openSheet('Income',`<form id="fIncome" class="formGrid"><div class="field"><label>Source / description</label><input id="inDesc" required placeholder="Salary, freelance…"></div><div class="field"><label>Expected amount (MAD)</label><input id="inAmt" required type="number" min="0" step="0.01"></div><div class="field"><label>Expected / received date</label><input id="inDate" required type="date" value="${today()}"></div><label class="checkline"><input type="checkbox" id="inReceived"> Mark this income as received now</label><button class="primary" type="submit">Save income</button></form><div class="recordList" id="incomeList"></div>`);
      $('#fIncome').onsubmit=e=>{e.preventDefault();m.income.push({id:id(),desc:$('#inDesc').value.trim(),amount:Number($('#inAmt').value),date:$('#inDate').value,received:$('#inReceived').checked,receivedDate:$('#inReceived').checked?$('#inDate').value:null});save();financeForm('income');toast('Income saved');};
      renderIncomeList();
    }else if(type==='fixed'){
      openSheet('Fixed Charges',`<form id="fFixed" class="formGrid"><div class="field"><label>Commitment</label><input id="fxDesc" required placeholder="Rent, internet…"></div><div class="field"><label>Amount (MAD)</label><input id="fxAmt" required type="number" min="0" step="0.01"></div><div class="field"><label>Due date</label><input id="fxDate" required type="date" value="${today()}"></div><button class="primary" type="submit">Add commitment</button></form><div class="recordList" id="fixedList"></div>`);
      $('#fFixed').onsubmit=e=>{e.preventDefault();m.fixed.push({id:id(),desc:$('#fxDesc').value.trim(),amount:Number($('#fxAmt').value),date:$('#fxDate').value});save();financeForm('fixed');toast('Commitment added');};renderFixedList();
    }else if(type==='market'||type==='big'){
      const market=type==='market'; openSheet(market?'Market — Buy & Record':'Big Purchases',`<form id="fSpend" class="formGrid"><div class="field"><label>${market?'Purchase':'Purchase / expense'}</label><input id="spDesc" required placeholder="${market?'Groceries':'Laptop, furniture…'}"></div><div class="field"><label>Amount (MAD)</label><input id="spAmt" required type="number" min="0" step="0.01"></div><div class="field"><label>Purchase date</label><input id="spDate" required type="date" value="${today()}"></div><div class="field"><label>Category</label><select id="spCat"><option>Food</option><option>Transport</option><option>Housing</option><option>Personal</option><option>Other</option></select></div><button class="primary" type="submit">Record purchase</button></form><div class="recordList" id="spendList"></div>`);
      $('#fSpend').onsubmit=e=>{e.preventDefault();m[type].push({id:id(),desc:$('#spDesc').value.trim(),amount:Number($('#spAmt').value),date:$('#spDate').value,category:$('#spCat').value});save();financeForm(type);toast(`Purchase saved for ${$('#spDate').value}`);};renderSpendList(type);
    }
  }
  function renderIncomeList(){ const el=$('#incomeList'); if(!el)return; const list=month().income; el.innerHTML=list.length?list.map(x=>`<div class="record"><span><b>${esc(x.desc)}</b><small>${x.received?'Received '+formatShortDate(x.receivedDate):'Expected '+formatShortDate(x.date)}</small></span><span class="right">${money(x.amount)} MAD<br>${!x.received?`<button data-rec="${x.id}">Mark received</button>`:''}<button data-delinc="${x.id}">Delete</button></span></div>`).join(''):'<div class="record">No income entries yet.</div>'; $$('[data-rec]').forEach(b=>b.onclick=()=>{const x=list.find(v=>v.id===b.dataset.rec);if(x){x.received=true;x.receivedDate=today();save();financeForm('income');}}); $$('[data-delinc]').forEach(b=>b.onclick=()=>{month().income=month().income.filter(v=>v.id!==b.dataset.delinc);save();financeForm('income');}); }
  function renderFixedList(){ const el=$('#fixedList');if(!el)return;const list=month().fixed;el.innerHTML=list.length?list.map(x=>`<div class="record"><span><b>${esc(x.desc)}</b><small>Due ${formatShortDate(x.date)}</small></span><span class="right">${money(x.amount)} MAD<br><button data-delfx="${x.id}">Delete</button></span></div>`).join(''):'<div class="record">No fixed charges yet.</div>';$$('[data-delfx]').forEach(b=>b.onclick=()=>{month().fixed=month().fixed.filter(v=>v.id!==b.dataset.delfx);save();financeForm('fixed');}); }
  function renderSpendList(type){ const el=$('#spendList');if(!el)return;const list=month()[type].slice().sort((a,b)=>b.date.localeCompare(a.date));el.innerHTML=list.length?list.map(x=>`<div class="record"><span><b>${categoryIcon(x.category)} ${esc(x.desc)}</b><small>${formatShortDate(x.date)} · ${esc(x.category)}</small></span><span class="right">${money(x.amount)} MAD<br><button data-delsp="${x.id}">Delete</button></span></div>`).join(''):'<div class="record">No purchases yet.</div>';$$('[data-delsp]').forEach(b=>b.onclick=()=>{month()[type]=month()[type].filter(v=>v.id!==b.dataset.delsp);save();financeForm(type);}); }

  function openLedger(){ const t=totals(); const m=month(); const rows=[...m.market.map(x=>({...x,t:'Market'})),...m.big.map(x=>({...x,t:'Big Purchase'})),...m.fixed.map(x=>({...x,t:'Fixed Charge'})),...m.income.map(x=>({...x,date:x.receivedDate||x.date,t:x.received?'Income received':'Income expected'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')); openSheet('Ledger',`<div class="record"><span>Received income</span><span class="right">${money(t.received)} MAD</span></div><div class="record"><span>Commitments</span><span class="right">${money(t.fixed)} MAD</span></div><div class="record"><span>Spending</span><span class="right">${money(t.spending)} MAD</span></div><div class="record"><span><b>Gold Left</b></span><span class="right"><b>${money(t.gold)} MAD</b></span></div><div class="recordList">${rows.length?rows.map(x=>`<div class="record"><span><b>${esc(x.t)}</b> · ${esc(x.desc)}<small>${formatShortDate(x.date)}</small></span><span class="right">${money(x.amount)} MAD</span></div>`).join(''):'No ledger entries.'}</div>`); }

  function changeMonth(){ openSheet('Change Month',`<div class="field"><label>Active month</label><input type="month" id="monthInput" value="${state.activeMonth}"></div><div class="actionsRow"><button class="primary" id="setMonth">Open month</button></div>`); $('#setMonth').onclick=()=>{const v=$('#monthInput').value;if(v){state.activeMonth=v;if(!state.months[v])state.months[v]=blankMonth();save();closeSheet();toast('Month changed');}}; }

  function settings(){ openSheet('Settings & Backup',`<p>Data is stored locally on this device.</p><div class="actionsRow"><button class="primary" id="backupJson">Export backup</button><button class="secondary" id="importJson">Import backup</button></div><input type="file" id="backupFile" accept="application/json" hidden><div class="actionsRow"><button class="danger" id="resetAll">Reset all data</button></div>`); $('#backupJson').onclick=exportBackup;$('#importJson').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=importBackup;$('#resetAll').onclick=()=>{if(confirm('Reset all The Way data on this device?')){state=blankState();save();closeSheet();toast('Data reset');}}; }
  function exportBackup(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); shareOrDownload(blob,`the-way-backup-${today()}.json`,'The Way backup'); }
  function importBackup(e){ const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);state=Object.assign(blankState(),parsed);save();closeSheet();toast('Backup imported');}catch{toast('That backup could not be read');}};r.readAsText(f); }

  function openQuestPuzzle(){ openSheet('The Box — The First Lock',`<div class="questStory"><p><b>Tangier · Main Quest · Chapter I</b></p><p>Inside your father's box is a lock made from four symbols. A margin note gives the order:</p><p><em>Moon → Gate → Star → Wave</em></p></div><div class="puzzleBox"><b>Press the four symbols in order.</b><div class="symbolGrid"><button class="symbol" data-symbol="moon">☾</button><button class="symbol" data-symbol="gate">⌂</button><button class="symbol" data-symbol="star">✦</button><button class="symbol" data-symbol="wave">≈</button></div><div class="sequence" id="puzzleSequence">${puzzleSeq.length?puzzleSeq.map(symbolGlyph).join(' → '):'—'}</div><button class="primary" id="unlockBox" style="width:100%;margin-top:10px">Unlock the Box</button><div class="reward">${state.puzzleDone?'Completed — Father’s Fragment I recovered.':'Reward: +100 XP · +1 Relic Token · Father’s Fragment I'}</div></div>`,'questModal'); $$('.symbol').forEach(b=>b.onclick=()=>{if(state.puzzleDone)return toast('This lock is already solved');puzzleSeq.push(b.dataset.symbol);if(puzzleSeq.length>4)puzzleSeq.shift();$('#puzzleSequence').textContent=puzzleSeq.map(symbolGlyph).join(' → ');}); $('#unlockBox').onclick=()=>{if(state.puzzleDone)return toast('Reward already claimed');if(puzzleSeq.join(',')==='moon,gate,star,wave'){state.puzzleDone=true;state.xp=(state.xp||0)+100;state.relics=(state.relics||0)+1;state.fragment=true;puzzleSeq=[];save();openQuestPuzzle();toast('Box unlocked — Level up!');}else{puzzleSeq=[];$('#puzzleSequence').textContent='—';toast('The lock resets');}}; }
  function symbolGlyph(s){return ({moon:'☾',gate:'⌂',star:'✦',wave:'≈'})[s]||'?';}
  function infoSheet(title,text){ openSheet(title,`<p style="line-height:1.55">${text}</p>`); }

  function exportPdf(){
    const t=totals(),m=month(); const lines=[
      'THE WAY - MONTHLY FINANCIAL REPORT',monthLabel(state.activeMonth),'',
      `Income expected: ${money(t.expected)} MAD`,`Income received: ${money(t.received)} MAD`,`Fixed commitments: ${money(t.fixed)} MAD`,`Market spending: ${money(t.market)} MAD`,`Big purchases: ${money(t.big)} MAD`,`Gold Left: ${money(t.gold)} MAD`,'',
      'INCOME',...m.income.map(x=>`${x.receivedDate||x.date} | ${x.desc} | ${money(x.amount)} MAD | ${x.received?'RECEIVED':'EXPECTED'}`),'',
      'FIXED CHARGES',...m.fixed.map(x=>`${x.date} | ${x.desc} | ${money(x.amount)} MAD`),'',
      'MARKET PURCHASES',...m.market.map(x=>`${x.date} | ${x.desc} | ${x.category} | ${money(x.amount)} MAD`),'',
      'BIG PURCHASES',...m.big.map(x=>`${x.date} | ${x.desc} | ${x.category} | ${money(x.amount)} MAD`)
    ];
    const bytes=buildSimplePdf(lines); const blob=new Blob([bytes],{type:'application/pdf'}); shareOrDownload(blob,`The-Way-${state.activeMonth}.pdf`,'The Way monthly report');
  }
  function ascii(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
  function buildSimplePdf(lines){
    const perPage=46; const pages=[]; for(let i=0;i<lines.length;i+=perPage)pages.push(lines.slice(i,i+perPage)); if(!pages.length)pages.push(['The Way']);
    const objs=[]; const pageRefs=[]; const fontObj=3+pages.length*2;
    objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
    pages.forEach((pg,i)=>{const pageObj=3+i*2, contentObj=4+i*2;pageRefs.push(`${pageObj} 0 R`);let y=795;const content=['BT','/F1 11 Tf','14 TL'];pg.forEach((line,idx)=>{const size=idx===0?16:idx===1?13:10.5;content.push(`/F1 ${size} Tf`);content.push(`50 ${y} Td (${ascii(line)}) Tj`);content.push(`${-50} ${-(idx===0?24:idx===1?22:15)} Td`);y-=idx===0?24:idx===1?22:15;});content.push('ET');const stream=content.join('\n');objs[contentObj]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;objs[pageObj]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontObj} 0 R >> >> /Contents ${contentObj} 0 R >>`;});
    objs[2]=`<< /Type /Pages /Kids [${pageRefs.join(' ')}] /Count ${pages.length} >>`; objs[fontObj]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
    let pdf='%PDF-1.4\n';const offsets=[0];for(let i=1;i<=fontObj;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objs[i]}\nendobj\n`;}const xref=pdf.length;pdf+=`xref\n0 ${fontObj+1}\n0000000000 65535 f \n`;for(let i=1;i<=fontObj;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;pdf+=`trailer\n<< /Size ${fontObj+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;return new TextEncoder().encode(pdf);
  }
  async function shareOrDownload(blob,name,title){ try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return;}}catch(e){} const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1200); }

  // Finance click wiring
  $('#hMarket').onclick=()=>travelThen('market',()=>financeForm('market')); $('#hSpotMarket').onclick=$('#hMarket').onclick;
  $('#hBig').onclick=()=>travelThen('big',()=>financeForm('big')); $('#hSpotBig').onclick=$('#hBig').onclick;
  $('#hIncome').onclick=()=>travelThen('income',()=>financeForm('income')); $('#hSpotIncome').onclick=$('#hIncome').onclick;
  $('#hFixed').onclick=()=>travelThen('fixed',()=>financeForm('fixed')); $('#hSpotFixed').onclick=$('#hFixed').onclick;
  $('#hSpotLedger').onclick=()=>travelThen('ledger',openLedger); $('#hSpotVillage').onclick=()=>{setRoute('village');toast('Village');};
  $('#hPdf').onclick=exportPdf; $('#hBackup').onclick=settings; $('#hMonth').onclick=changeMonth;
  $('#hNavWay').onclick=()=>showScreen('wayScreen'); $('#hNavFinance').onclick=()=>showScreen('financeScreen'); $('#hNavSettings').onclick=settings; $('#hNavActivity').onclick=()=>{window.scrollTo({top:document.body.scrollHeight*.65,behavior:'smooth'});}; $('#hNavVillage').onclick=()=>{setRoute('village');window.scrollTo({top:0,behavior:'smooth'});};

  // The Way exact screen wiring
  $('#hWayPortrait').onclick=()=>showScreen('financeScreen'); $('#hViewDetails').onclick=openQuestPuzzle; $('#hQuest').onclick=openQuestPuzzle;
  $('#hSkills').onclick=()=>infoSheet('Skills','Skills will unlock as Issam completes boxes and deciphers relics. The first quest currently contains the only playable puzzle in this build.');
  $('#hItems').onclick=()=>infoSheet('Items',state.fragment?'Father’s Fragment I has been recovered from the first box.':'No key quest items recovered yet.');
  $('#hEquipment').onclick=()=>infoSheet('Equipment','Equipment progression is reserved for later quests.');
  $('#hStatus').onclick=()=>infoSheet('Status',`Level ${Math.floor((state.xp||0)/100)+1} · ${state.xp||0} XP · ${state.relics||0} Relic Token${state.relics===1?'':'s'}`);
  $('#hMap').onclick=()=>toast('World map — Tangier is the current location'); $('#hWorldMap').onclick=$('#hMap').onclick; $('#hLocalMap').onclick=()=>toast('Local Tangier map will unlock with the next quest');
  $('#hLore').onclick=()=>infoSheet('Lore','The war left records fragmented and contradictory. Issam’s father spent years tracing a hidden sequence of boxes across Morocco. The first truth begins in Tangier.');

  window.addEventListener('popstate',()=>{ if($('#wayScreen').classList.contains('active'))showScreen('financeScreen'); });
  
  render();
})();
</script>
